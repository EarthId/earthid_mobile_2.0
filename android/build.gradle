import org.apache.tools.ant.taskdefs.condition.Os


buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 26
        compileSdkVersion = 34
        targetSdkVersion = 34
        kotlinVersion = "1.8.0"
 if (System.properties['os.arch'] == "aarch64") {
            // For M1 Users we need to use the NDK 24 which added support for aarch64
            ndkVersion = "25.1.8937393"
        } else {
            // Otherwise we default to the side-by-side NDK version from AGP.
            ndkVersion = "21.4.7075529"
        }







    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
                  classpath 'com.google.android.gms:strict-version-matcher-plugin:1.2.1'
        classpath("com.facebook.react:react-native-gradle-plugin")
     classpath("de.undercouch:gradle-download-task:4.1.2")
          classpath 'com.google.gms:google-services:4.3.2'
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}


allprojects {
  repositories {
    google()
    mavenLocal()
    // jcenter() is deprecated, but if you need it for legacy deps keep it:
    jcenter()
    maven { url "https://jitpack.io" }
    maven { url("$rootDir/../node_modules/react-native/android") }
    maven { url("$rootDir/../node_modules/jsc-android/dist") }
    maven { url "https://cdn.veriff.me/android/" }
    mavenCentral {
      content { excludeGroup "com.facebook.react" }
    }
  }

  // 🔧 Redirect dead artifact to a live fork
  configurations.all {
    resolutionStrategy.eachDependency { details ->
      if (details.requested.group == 'com.github.barteksc' &&
          details.requested.name == 'android-pdf-viewer') {
        details.useTarget 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.1'
        details.because 'barteksc:2.8.2 is no longer published; use maintained fork'
      }
    }
  }
}


apply plugin: 'com.google.android.gms.strict-version-matcher-plugin'
apply plugin: "com.facebook.react.rootproject"
